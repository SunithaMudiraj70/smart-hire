# ==============================================================================
# smart-hire - Render Blueprint (Docker Container Runtime Variant)
# Use this file if you prefer deploying containerized images via Docker
# ==============================================================================

version: "1"

databases:
  - name: smart-hire-postgres
    databaseName: smart_hire
    user: smart_hire_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  # 1. Containerized API Web Service
  - type: web
    name: smart-hire-api-docker
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-hire-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "7"
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: RUN_SCHEDULER_IN_API
        value: "true"
      - key: VECTOR_BACKEND
        value: local
      - key: SEED_DEMO
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: RAPID_API_KEY
        sync: false

  # 2. Containerized Frontend Web Service (Nginx)
  - type: web
    name: smart-hire-web-docker
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-hire-api-docker
          property: url

