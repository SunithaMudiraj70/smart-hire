version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: smart_hire_postgres
    environment:
      POSTGRES_USER: smart_hire_user
      POSTGRES_PASSWORD: smart_hire_password
      POSTGRES_DB: smart_hire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_hire_user -d smart_hire"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_hire_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smart_hire_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://smart_hire_user:smart_hire_password@postgres:5432/smart_hire
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: smart_hire_production_secret_key_99
      LOG_LEVEL: INFO
      VECTOR_BACKEND: local
      RUN_SCHEDULER_IN_API: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smart_hire_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://smart_hire_user:smart_hire_password@postgres:5432/smart_hire
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: smart_hire_production_secret_key_99
      LOG_LEVEL: INFO
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: smart_hire_web
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
