# ==============================================================================
# smart-hire - Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
# Deploy complete stack in one click:
#   1. PostgreSQL Database (Free Tier / Managed)
#   2. FastAPI Backend Web Service (Free Tier, automatic DB migrations, healthcheck)
#   3. React + Vite Frontend Static Site (Free Tier, fast CDN, SPA routing)
# ==============================================================================

version: "1"

databases:
  - name: smart-hire-postgres
    databaseName: smart_hire
    user: smart_hire_user
    plan: free
    region: oregon # Options: oregon, frankfurt, ohio, singapore
    ipAllowList: [] # Restrict direct access to internal Render services only

services:
  # ----------------------------------------------------------------------------
  # 1. smart-hire Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-hire-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Database connection securely bound from the managed PostgreSQL above
      - key: DATABASE_URL
        fromDatabase:
          name: smart-hire-postgres
          property: connectionString

      # Cryptographically generated JWT secret key (Render auto-generates on first deploy)
      - key: JWT_SECRET_KEY
        generateValue: true

      # Secret token for triggering ingestion via POST /api/admin/ingest from GitHub Actions
      - key: ADMIN_TOKEN
        generateValue: true

      - key: JWT_ACCESS_EXPIRE_MINUTES
        value: "15"

      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "7"

      - key: LOG_LEVEL
        value: INFO

      - key: DEBUG
        value: "false"

      - key: ENVIRONMENT
        value: production

      # Disabled in API process; ingestion is scheduled externally via GitHub Actions /api/admin/ingest
      - key: RUN_SCHEDULER_IN_API
        value: "false"

      - key: VECTOR_BACKEND
        value: local

      - key: SEED_DEMO
        value: "false"

      # Explicit origins (never '*' when credentials/cookies are used)
      - key: CORS_ORIGINS
        value: "https://smart-hire-web.onrender.com,http://localhost:3000,http://127.0.0.1:3000"

      # Resend HTTP API for daily email digests (zero SMTP dependencies)
      - key: RESEND_API_KEY
        sync: false

      - key: RESEND_FROM
        value: "smart-hire <notifications@smart-hire.app>"

      # External Job Board API Keys (Optional: set in Render Dashboard if you have keys)
      - key: RAPID_API_KEY
        sync: false

      - key: RAPIDAPI_HOST
        value: jsearch.p.rapidapi.com

      - key: ADZUNA_APP_ID
        sync: false

      - key: ADZUNA_APP_KEY
        sync: false

      - key: FEATURE_B2B_RECRUITER
        value: "true"

  # ----------------------------------------------------------------------------
  # 2. smart-hire Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-hire-web
    runtime: static
    region: oregon
    plan: free
    branch: main
    buildCommand: npm --prefix web install && npm --prefix web run build
    publishPath: web/dist
    autoDeploy: true
    routes:
      # React Router Single Page Application fallback rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Injects the live public URL of smart-hire-api into Vite build
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-hire-api
          property: url

  # ----------------------------------------------------------------------------
  # 3. Dedicated Background Ingestion Worker (Optional - Starter Plan / Paid)
  # Uncomment below if you upgrade Render plan and set RUN_SCHEDULER_IN_API: "false"
  # ----------------------------------------------------------------------------
