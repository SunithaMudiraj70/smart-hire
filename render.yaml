# ==============================================================================
# smart-hire - Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
# Deploy complete stack in one click:
#   1. PostgreSQL Database (Free Tier / Managed)
#   2. FastAPI Backend Web Service (Free Tier, automatic DB migrations, healthcheck)
#   3. React + Vite Frontend Static Site (Free Tier, fast CDN, SPA routing)
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. smart-hire Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-hire-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Supabase PostgreSQL Database Connection String
      # Render will prompt for this during Blueprint setup, or set in Service Environment settings.
      - key: DATABASE_URL
        sync: false

      - key: SUPABASE_URL
        value: https://rnxyluziclnpckprmmrq.supabase.co

      - key: SUPABASE_KEY
        sync: false

      # Cryptographically generated JWT secret key (Render auto-generates on first deploy)
      - key: JWT_SECRET_KEY
        generateValue: true

      # Secret token for triggering ingestion via POST /api/admin/ingest from GitHub Actions
      - key: ADMIN_TOKEN
        generateValue: true

      - key: JWT_ACCESS_EXPIRE_MINUTES
        value: "15"

      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "7"

      - key: LOG_LEVEL
        value: INFO

      - key: DEBUG
        value: "false"

      - key: ENVIRONMENT
        value: production

      # Disabled in API process; ingestion is scheduled externally via GitHub Actions /api/admin/ingest
      - key: RUN_SCHEDULER_IN_API
        value: "false"

      - key: VECTOR_BACKEND
        value: local

      - key: SEED_DEMO
        value: "false"

      # Explicit origins (never '*' when credentials/cookies are used)
      - key: CORS_ORIGINS
        value: "https://smart-hire-web.onrender.com,http://localhost:3000,http://127.0.0.1:3000"

      # Resend HTTP API for daily email digests (zero SMTP dependencies)
      - key: RESEND_API_KEY
        sync: false

      - key: RESEND_FROM
        value: "smart-hire <notifications@smart-hire.app>"

      # External Job Board API Keys (Optional: set in Render Dashboard if you have keys)
      - key: RAPID_API_KEY
        sync: false

      - key: RAPIDAPI_HOST
        value: jsearch.p.rapidapi.com

      - key: FEATURE_B2B_RECRUITER
        value: "true"

  # ----------------------------------------------------------------------------
  # 2. smart-hire Frontend Static Site (Served via Render Global CDN)
  # Note: Static sites are globally distributed (no region) and free (no plan).
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-hire-web
    runtime: static
    branch: main
    buildCommand: npm --prefix web install && npm --prefix web run build
    staticPublishPath: web/dist
    autoDeploy: true
    routes:
      # React Router Single Page Application fallback rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points the client-side API requests to the deployed backend Web Service
      - key: VITE_API_URL
        value: https://smart-hire-api.onrender.com
