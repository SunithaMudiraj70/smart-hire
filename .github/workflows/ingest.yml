name: Hourly Ingestion & Health Audit

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger-ingest:
    name: Trigger Ingestion Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Trigger smart-hire ingestion and link health audit
        run: |
          API_URL="${{ secrets.API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://smart-hire-api.onrender.com"
          fi
          echo "Triggering ingestion on $API_URL/api/admin/ingest..."
          curl -fsS --retry 3 --retry-delay 30 -m 120 -X POST -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" "$API_URL/api/admin/ingest" || echo "Note: Admin ingest call returned non-zero. Verify API_URL and ADMIN_TOKEN in GitHub secrets."

