name: smart-hire CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyjwt bcrypt email-validator apscheduler sentence-transformers scikit-learn pytest pytest-asyncio pytest-cov
      - name: Run Backend Tests & Coverage
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET_KEY: test_ci_secret_key_12345
          SEED_DEMO: "false"
        run: |
          pytest -q tests/

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci
      - name: Run Vitest Unit Tests
        working-directory: ./web
        run: npm test -- --run
      - name: Type-Check & Production Build
        working-directory: ./web
        run: |
          npx tsc --noEmit
          npm run build
